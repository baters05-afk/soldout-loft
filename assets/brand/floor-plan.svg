    <text class="tiny" x="28" y="63">На плане сохранены исходные стены, проёмы, окна, колонны, сантехника и подписанные размеры. Назначения неподписанных зон не добавлялись.</text>
    <text class="tiny" x="28" y="80">ОК-2: низ окна 1 460 мм, высота 1 516 мм. ОК-1: высота 2 191 мм, высота низа в исходнике не указана.</text>
