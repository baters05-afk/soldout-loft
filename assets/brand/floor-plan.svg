  <g>
    <rect class="column" x="545" y="445" width="16" height="16"/>
    <path class="thin" d="M541 441L565 465M565 441L541 465"/>
    <rect class="column" x="868" y="445" width="16" height="16"/>
    <path class="thin" d="M864 441L888 465M888 441L864 465"/>
    <text class="tiny" x="553" y="427" text-anchor="middle">КОЛОННА</text>
    <text class="tiny" x="876" y="427" text-anchor="middle">КОЛОННА</text>
  </g>

  <!-- санузлы -->
  <g class="thin">
    <rect x="1039" y="548" width="128" height="82" rx="6"/>
    <ellipse cx="1081" cy="589" rx="16" ry="21"/><ellipse cx="1125" cy="589" rx="16" ry="21"/>
    <circle cx="1081" cy="589" r="5"/><circle cx="1125" cy="589" r="5"/>
    <path d="M1048 695c0-17 13-29 29-29s29 12 29 29v34h-58zM1111 695c0-17 13-29 29-29s29 12 29 29v34h-58z"/>
    <path d="M1055 729h44M1118 729h44"/>
  </g>

  <!-- размеры -->
  <g>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M249 716H1017"/>
    <text class="dim" x="633" y="708" text-anchor="middle">15 110</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M272 164V760"/>
    <text class="dim" x="288" y="466" transform="rotate(-90 288 466)" text-anchor="middle">9 936</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M553 480H876"/>
    <text class="dim" x="714" y="474" text-anchor="middle">4 810</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M876 382H1190"/>
    <text class="dim" x="1033" y="376" text-anchor="middle">4 925</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M584 461V716"/>
    <text class="dim" x="600" y="590" transform="rotate(-90 600 590)" text-anchor="middle">4 915</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M852 461V716"/>
    <text class="dim" x="868" y="590" transform="rotate(-90 868 590)" text-anchor="middle">4 918</text>
  </g>

  <!-- подписи помещений -->
  <g text-anchor="middle">
    <text class="label" x="136" y="397">Доп. помещение</text>
    <text class="area" x="136" y="421">22,4 м²</text>
    <text class="label" x="628" y="352">Основной зал</text>
    <text class="area" x="628" y="378">150,0 м²</text>
    <text class="label" x="1036" y="267">Отдельная зона</text>
    <text class="label" x="1103" y="683">Два санузла</text>
  </g>

  <!-- легенда -->
  <g transform="translate(66 850)">
    <rect x="0" y="0" width="1148" height="76" rx="18" fill="#fbfaf8" stroke="#cbd1d2"/>
    <rect x="28" y="24" width="44" height="12" rx="3" class="heater"/>
    <text class="note" x="88" y="35">Приборы отопления</text>
    <rect x="315" y="21" width="18" height="18" class="column"/>
    <text class="note" x="350" y="35">Металлические колонны</text>
    <path class="thin" d="M624 30H672"/>
    <text class="note" x="690" y="35">Двери и перегородки</text>
    <path class="measure" d="M902 30H950"/>
    <text class="note" x="968" y="35">Контрольный размер</text>
    <text class="tiny" x="28" y="60">Схема перерисована по исходному обмерному плану без изменения указанных размеров</text>
  </g>
</svg>
