<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 984" role="img" aria-labelledby="title desc">
  <title id="title">План пространства SOLDOUT</title>
  <desc id="desc">Векторный план пространства SOLDOUT общей площадью 172,4 квадратного метра. Показаны стены, проёмы, окна, колонны, санузлы, отопление и исходные размеры.</desc>
  <defs>
    <style>
      .bg{fill:#f2efeb}.paper{fill:#fbfaf8}.wall{fill:#3f5a73}.part{fill:none;stroke:#253640;stroke-width:3}
      .thin{fill:none;stroke:#3f5a73;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .window{fill:#fbfaf8;stroke:#3f5a73;stroke-width:1.8}.glass{stroke:#8da0aa;stroke-width:1}
      .heat{fill:#8c796b}.heatline{fill:none;stroke:#8c796b;stroke-width:2}.sewer{fill:none;stroke:#253640;stroke-width:3}
      .dimline{fill:none;stroke:#8c796b;stroke-width:1.15}.diag{fill:none;stroke:#3f5a73;stroke-width:1.15;opacity:.72}
      .hatch{fill:#e8edec}.wet{fill:#edf1f0}.column{fill:#3f5a73;stroke:#17262f;stroke-width:1.5}
      .head{font:500 30px Jost,Arial,sans-serif;letter-spacing:.04em;fill:#17262f}
      .kicker{font:500 13px Jost,Arial,sans-serif;letter-spacing:.22em;fill:#806f60}
      .label{font:500 16px Jost,Arial,sans-serif;fill:#17262f}.small{font:400 12px Jost,Arial,sans-serif;fill:#56646b}
      .dim{font:500 11px Jost,Arial,sans-serif;fill:#806f60}.tiny{font:500 10px Jost,Arial,sans-serif;fill:#56646b}
    </style>
    <marker id="arr" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#806f60"/>
    </marker>
    <pattern id="brand" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 36H72M36 0V72" stroke="#3f5a73" stroke-width="1" opacity=".035"/>
    </pattern>
  </defs>

  <rect class="bg" width="1280" height="984"/>
  <rect width="1280" height="984" fill="url(#brand)"/>
  <text class="kicker" x="32" y="25">ПЛАН ПРОСТРАНСТВА</text>
