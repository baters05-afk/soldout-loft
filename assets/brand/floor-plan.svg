  <!-- Легенда -->
  <g transform="translate(84 844)">
    <rect x="0" y="0" width="1112" height="100" rx="18" fill="#fbfaf8" stroke="#c8d0d1"/>
    <rect class="wall" x="28" y="22" width="42" height="14"/><text class="small" x="83" y="34">стены и простенки</text>
