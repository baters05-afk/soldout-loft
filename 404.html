<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — SOLDOUT</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-soloft-light.png?v=20260816" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-soloft-dark.png?v=20260816" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--slate:#3F5A73;--bone:#E6E2DF;--white:#FFFFFF;--ink:#00080D;
  --bone-l:color-mix(in srgb,var(--bone) 55%,var(--white));--taupe:#806F60;
  --ink-60:rgba(0,8,13,.6);--ink-12:rgba(0,8,13,.12);
  --slate-d:color-mix(in srgb,var(--slate) 78%,var(--ink))}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:grid;place-items:center;padding:24px;
  background:var(--bone-l);color:var(--ink);
  font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
.box{max-width:520px;text-align:center}
img{height:30px;width:auto;margin:0 auto 34px}
.code{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--taupe);font-weight:500;margin-bottom:16px}
h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:500;letter-spacing:-.025em;
  line-height:1.1;margin-bottom:14px}
p{color:var(--ink-60);margin-bottom:30px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;padding:14px 26px;border-radius:100px;
  font-size:.92rem;font-weight:500;text-decoration:none;transition:.25s}
.p{background:var(--slate);color:var(--white)}
.p:hover{background:var(--slate-d)}
.o{border:1px solid var(--ink-12);color:var(--ink)}
.o:hover{border-color:var(--slate);color:var(--slate)}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/brand/logo-h-dark-c.png" alt="SOLDOUT">
    <p class="code">Ошибка 404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.
       Вернитесь на главную или напишите нам — подскажем.</p>
    <div class="row">
      <a class="btn p" href="/">На главную</a>
      <a class="btn o" href="https://t.me/shipovegor" target="_blank" rel="noopener">Написать в Telegram</a>
    </div>
  </div>
</body>
</html>
