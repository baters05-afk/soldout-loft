name: Deploy SoldOut to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Timeweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Текущий FTP-пользователь Timeweb принимает вход только в обычном режиме.
          # После включения FTPS для этого пользователя здесь можно вернуть ftps.
          protocol: ftp
          local-dir: ./
          # Пользователь cq746747_soldout уже ограничен этой папкой в Timeweb.
          server-dir: /
          exclude: |
            **/.git*
            /.git*/
            /node_modules/
            .github/**
            README.md
            DEPLOY.md
            TIMEWEB.md
            .vercelignore
            vercel.json
